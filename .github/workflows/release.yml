name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check release version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag and VERSION do not match.')
          PY
      - name: Core and packaging tests
        run: python3 -m unittest discover -s tests -v
      - name: Import optional signing identity
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          test -n "$P12_PASSWORD" && test -n "$CODESIGN_IDENTITY"
          certificate_path="$RUNNER_TEMP/converter-certificate.p12"
          keychain_path="$RUNNER_TEMP/converter-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '::add-mask::%s\n' "$keychain_password"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          printf 'CONVERTER_SIGNING_KEYCHAIN=%s\n' "$keychain_path" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: pythonorg-3.14.3-macos11-50b709f7
      - name: Prepare private build runtime
        run: python3 packaging/bootstrap_python.py
      - name: Build, verify and package
        run: |
          build_args=(--package --arch '${{ matrix.arch }}')
          if [[ -n "$APPLE_ID" || -n "$APPLE_APP_PASSWORD" || -n "$APPLE_TEAM_ID" ]]; then
            test -n "$APPLE_ID" && test -n "$APPLE_APP_PASSWORD" && test -n "$APPLE_TEAM_ID"
            build_args+=(--notarize)
          fi
          python3 build_app.py "${build_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/DialogueConverter-*.dmg
            dist/DialogueConverter-*.zip
            dist/SHA256SUMS-*.txt
      - name: Remove temporary signing material
        if: always() && env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          if [[ -n "$CONVERTER_SIGNING_KEYCHAIN" ]]; then security delete-keychain "$CONVERTER_SIGNING_KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/converter-certificate.p12"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish both architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat release/SHA256SUMS-*.txt > release/SHA256SUMS
          cd release
          sha256sum -c SHA256SUMS
          cd ..
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/SHA256SUMS \
            --verify-tag --prerelease --title "对话转换器 ${GITHUB_REF_NAME#v} · 原生转换预览" --notes-file docs/RELEASE_NOTES.md
